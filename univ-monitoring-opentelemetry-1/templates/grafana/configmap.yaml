apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-university
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: university-monitoring
data:
  university-overview.json: |
    {
      "title": "University App — Overview",
      "uid": "university-overview",
      "schemaVersion": 36,
      "version": 9,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pods Running — university-app",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": "Prometheus",
          "targets": [{"expr": "count(kube_pod_status_phase{namespace=\"university-app\",phase=\"Running\"})", "legendFormat": "Running pods"}],
          "options": { "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "value": null, "color": "green" }] } } }
        },
        {
          "id": 2,
          "title": "Replicas désirées vs disponibles",
          "type": "bargauge",
          "gridPos": { "x": 6, "y": 0, "w": 10, "h": 4 },
          "datasource": "Prometheus",
          "targets": [
            { "expr": "kube_deployment_spec_replicas{namespace=\"university-app\"}", "legendFormat": "Désirées — {{ "{{" }}deployment{{ "}}" }}" },
            { "expr": "kube_deployment_status_replicas_available{namespace=\"university-app\"}", "legendFormat": "Disponibles — {{ "{{" }}deployment{{ "}}" }}" }
          ],
          "options": { "orientation": "horizontal" }
        },
        {
          "id": 3,
          "title": "HPA — Replicas actuelles",
          "type": "stat",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 4 },
          "datasource": "Prometheus",
          "targets": [{"expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"university-app\"}", "legendFormat": "{{ "{{" }}horizontalpodautoscaler{{ "}}" }}"}],
          "options": { "colorMode": "value", "graphMode": "area" }
        },
        {
          "id": 10,
          "title": "CPU Usage vs Requests (HPA Match)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "datasource": "Prometheus",
          "targets": [{
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"university-app\", container!=\"\", container!=\"POD\"}[2m])) / sum by (pod) (kube_pod_container_resource_requests{namespace=\"university-app\", resource=\"cpu\"})",
            "legendFormat": "{{ "{{" }}pod{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 11,
          "title": "Mémoire (working set) par pod (cAdvisor)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 8 },
          "datasource": "Prometheus",
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"university-app\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{ "{{" }}pod{{ "}}" }}"}],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 20,
          "title": "student-service — Requêtes HTTP/s",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 20, "w": 8, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{"expr": "sum by (method, status) (rate(flask_http_request_total{job=\"student-service\"}[2m]))", "legendFormat": "{{ "{{" }}method{{ "}}" }} {{ "{{" }}status{{ "}}" }}"}],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 21,
          "title": "enrollment-service — Requêtes HTTP/s",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 20, "w": 8, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{"expr": "sum by (method, status) (rate(flask_http_request_total{job=\"enrollment-service\"}[2m]))", "legendFormat": "{{ "{{" }}method{{ "}}" }} {{ "{{" }}status{{ "}}" }}"}],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 22,
          "title": "teacher-admin-service — Requêtes HTTP/s (Spring Boot)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 20, "w": 8, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{"expr": "sum by (method, status) (rate(http_server_requests_seconds_count{job=\"teacher-admin-service\"}[2m]))", "legendFormat": "{{ "{{" }}method{{ "}}" }} {{ "{{" }}status{{ "}}" }}"}],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 30,
          "title": "Latence P95 — student-service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 27, "w": 8, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(flask_http_request_duration_seconds_bucket{job=\"student-service\"}[2m])))", "legendFormat": "p95"}],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 31,
          "title": "Latence P95 — enrollment-service",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 27, "w": 8, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(flask_http_request_duration_seconds_bucket{job=\"enrollment-service\"}[2m])))", "legendFormat": "p95"}],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 32,
          "title": "Latence P95 — teacher-admin-service (Spring Boot)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 27, "w": 8, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=\"teacher-admin-service\"}[2m])))", "legendFormat": "p95"}],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 40,
          "title": "PVC — Espace utilisé (postgres)",
          "type": "gauge",
          "gridPos": { "x": 0, "y": 34, "w": 8, "h": 5 },
          "datasource": "Prometheus",
          "targets": [{"expr": "kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=\"university-app\"}", "legendFormat": "{{ "{{" }}persistentvolumeclaim{{ "}}" }}"}],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 41,
          "title": "Restarts par pod",
          "type": "bargauge",
          "gridPos": { "x": 8, "y": 34, "w": 16, "h": 5 },
          "datasource": "Prometheus",
          "targets": [{"expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"university-app\"})", "legendFormat": "{{ "{{" }}pod{{ "}}" }}"}],
          "options": { "orientation": "horizontal" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 3, "color": "yellow" }, { "value": 5, "color": "red" }] } } }
        },
        {
          "id": 50,
          "title": "Traces — Latence P95 par service (spanmetrics)",
          "description": "Latence P95 calculée depuis les spanmetrics OTel.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 39, "w": 24, "h": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(traces_duration_milliseconds_bucket[2m])))",
              "legendFormat": "p95 — {{ "{{" }}service_name{{ "}}" }}"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le, service_name) (rate(traces_duration_milliseconds_bucket[2m])))",
              "legendFormat": "p50 — {{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 51,
          "title": "Traces — Taux d'erreur par service (spanmetrics)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 47, "w": 12, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{
            "expr": "sum by (service_name) (rate(traces_calls_total{status_code=~\"STATUS_CODE_ERROR|2\"}[2m])) or (sum by (service_name) (rate(traces_calls_total[2m])) - sum by (service_name) (rate(traces_calls_total[2m])))",
            "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 52,
          "title": "Traces — Requêtes/s par service (spanmetrics)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 47, "w": 12, "h": 7 },
          "datasource": "Prometheus",
          "targets": [{
            "expr": "sum by (service_name) (rate(traces_calls_total[2m]))",
            "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 60,
          "title": "Service Dependency Graph (Requêtes inter-services)",
          "description": "Flux de requêtes entre services générés par le connecteur servicegraph.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 54, "w": 24, "h": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (client, server) (rate(traces_service_graph_request_total[2m]))",
              "legendFormat": "{{ "{{" }}client{{ "}}" }} → {{ "{{" }}server{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2 } } }
        }
      ]
    }