apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: scenario-5-scale-down-minimum
  namespace: university-chaos
  labels:
    app.kubernetes.io/part-of: university-chaos
    scenario: "5"
    invariant: "minimum-replicas"
spec:
  action: delay
  mode: all
