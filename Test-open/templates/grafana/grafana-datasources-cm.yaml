apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: university-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3100
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: 'Prometheus'
          tracesToMetrics:
            datasourceUid: 'Prometheus'
            spanEndTime: 'end_time'
            spanStartTime: 'start_time'
            tags: [{ key: 'service.name', value: 'service' }]