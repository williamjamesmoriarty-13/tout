name: PR — teacher-admin-service

on:
  pull_request:
    branches: [main]
    paths:
      - 'teacher-admin-service/**'
      - 'lint/**'
      - '.github/workflows/pr-teacher-admin-service.yml'

concurrency:
  group: pr-teacher-admin-service-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Checkstyle, PMD, OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'                        # gardes aligné avec ton Java ≥21
          cache: 'maven'

      - name: voir NVD qj
        run: echo ${{ vars.NVD_API_KEY }}   

      - name: Lint & SCA — teacher-admin-service uniquement  
        run: |
          export NVD_API_KEY=${{ vars.NVD_API_KEY }} 
          ./lint/scripts/lint.sh --service teacher --no-gitleaks --autoUpdate true \
          --connectionTimeout 60000 \
          --log /tmp/dependency-check.log

  unit-tests:
    name: Tests unitaires (sans DB)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: mvn test au racine du service
        working-directory: teacher-admin-service
        run: mvn test
        # Aucun service Postgres ici volontairement : si un test échoue
        # faute de DB, il n'est pas vraiment unitaire — mocke-le ou
        # déplace-le en intégration.

  migration-check:
    name: Vérification des migrations
    needs: lint
    runs-on: ubuntu-latest
    # PAS de bloc `services:` ici : les service containers démarrent AVANT
    # le checkout du repo, donc un volume pointant vers postgres/init/
    # serait vide au démarrage. On lance Postgres nous-mêmes, après
    # checkout, pour que le vrai 01-init-schemas.sh tourne comme en local.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Démarrer Postgres avec le vrai script d'init
        run: |
          docker run -d --name pg-ci \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=university_db \
            -e STUDENT_DB_USER=student_app \
            -e STUDENT_DB_PASSWORD=student_app_pwd \
            -e TEACHER_ADMIN_DB_USER=teacher_admin_app \
            -e TEACHER_ADMIN_DB_PASSWORD=teacher_admin_app_pwd \
            -e ENROLLMENT_DB_USER=enrollment_app \
            -e ENROLLMENT_DB_PASSWORD=enrollment_app_pwd \
            -v "${{ github.workspace }}/postgres/init:/docker-entrypoint-initdb.d" \
            postgres:16-alpine
          # ^ REMPLACE POSTGRES_DB et les 6 identifiants par les vraies
          # valeurs de ton docker-compose.yml.

      - name: Attendre que Postgres soit prêt
        run: |
          for i in {1..15}; do
            docker exec pg-ci pg_isready -U postgres && break
            sleep 2
          done

      - name: Appliquer les migrations
        working-directory: teacher-admin-service
        run: |
              mvn flyway:migrate \
                  -Dflyway.url="jdbc:postgresql://localhost:5432/university_db?currentSchema=teacher_admin_schema" \
                  -Dflyway.user=teacher_admin_app \
                  -Dflyway.password=teacher_admin_app_pwd \
                  -Dflyway.schemas=teacher_admin_schema


  docker-build:
    name: Build image + scan Trivy
    needs: [unit-tests, migration-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image (validation uniquement — pas de push en PR)
        run: docker build -f teacher-admin-service/Dockerfile -t teacher-admin-service:pr-${{ github.event.pull_request.number }} teacher-admin-service/

      - name: Scan de vulnérabilités — Trivy
        uses: aquasecurity/trivy-action@v0.36.0   # vérifie toi-même la dernière release avant de committer
        with:
          image-ref: teacher-admin-service:pr-${{ github.event.pull_request.number }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
