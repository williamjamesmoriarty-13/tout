[bandit]
# Niveau de sévérité minimum à reporter : LOW | MEDIUM | HIGH
# On commence à LOW pour ne rien manquer, le script filtre ensuite
severity = LOW
confidence = MEDIUM

# Exclure les dossiers de test (les assert et mocks génèrent des faux positifs)
exclude_dirs = tests,migrations,venv,.venv

# Tests Bandit à skipper (faux positifs documentés) :
# B101 : assert utilisé dans les tests unitaires — normal et voulu
# B311 : random standard — pas de crypto ici, juste des IDs de trace
skips = B101,B311