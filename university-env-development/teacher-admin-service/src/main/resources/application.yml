server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: teacher-admin-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}?currentSchema=${DB_SCHEMA:teacher_admin_schema}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:teacher_admin_schema}
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:teacher_admin_schema}
    default-schema: ${DB_SCHEMA:teacher_admin_schema}
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: teacher-admin-service

logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.springframework.web: WARN

app:
  cors:
    allowed-origins: "*"